name: CI

on:
  push:
    branches:
      - master
  # Pull requests from forks run too, without access to secrets (this workflow needs none).
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SDK_VERSION: "10.0.x"

jobs:
  build-test-format:
    name: Build, test and format
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}
          # Caches the NuGet global packages folder; every package version is pinned centrally in
          # Directory.Packages.props, so its hash is the cache key.
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore Jellyfin.sln

      - name: Build (Release)
        run: dotnet build Jellyfin.sln --configuration Release --no-restore

      # No ffmpeg on the runner: the integration tests set JELLYFIN_FFMPEG__NOVALIDATION
      # themselves and the encoder tests parse recorded ffmpeg output.
      - name: Test
        run: >
          dotnet test Jellyfin.sln
          --configuration Release
          --no-build
          --verbosity minimal

      - name: Check formatting
        run: dotnet format Jellyfin.sln --verify-no-changes --no-restore --verbosity minimal
