name: Release

# Builds the Linux packages (self-contained server with the web client embedded, as .deb and
# .tar.gz for amd64 and arm64, plus the web client alone as .tar.gz) and publishes them as a
# GitHub Release. A tag v* publishes; a manual run is a dry run unless `publish` is set, and
# then it only works when it was started on an existing v* tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      web_ref:
        description: Branch, tag or commit of 6a8i/siren-web to build (used when no tag of the same name as the server tag exists)
        default: main
        type: string
      publish:
        description: Create the GitHub Release (needs the run to be started on a v* tag)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SDK_VERSION: "10.0.x"

jobs:
  web:
    name: Build the web client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      web_ref: ${{ steps.meta.outputs.web_ref }}

    steps:
      # The version is only used for file names and the deb control file; the assembly version
      # in SharedVersion.cs is fixed and not touched here.
      - name: Decide the version and the web ref
        id: meta
        env:
          WEB_REF_INPUT: ${{ inputs.web_ref }}
          WEB_TOKEN: ${{ secrets.SIREN_WEB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ -n "$(git ls-remote --tags "https://${WEB_TOKEN:+x-access-token:$WEB_TOKEN@}github.com/6a8i/siren-web" "refs/tags/$GITHUB_REF_NAME")" ]; then
              web_ref="$GITHUB_REF_NAME"
            else
              web_ref="${WEB_REF_INPUT:-main}"
            fi
          else
            version="0.0.0-dev.$GITHUB_RUN_NUMBER"
            web_ref="${WEB_REF_INPUT:-main}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "web_ref=$web_ref" >> "$GITHUB_OUTPUT"
          echo "Version $version, web client from siren-web@$web_ref"

      - name: Check out the web client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 6a8i/siren-web
          ref: ${{ steps.meta.outputs.web_ref }}
          token: ${{ secrets.SIREN_WEB_TOKEN || github.token }}
          path: web
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit

      - name: Build
        working-directory: web
        run: npm run build:production

      - name: Upload the web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: siren-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  build:
    name: Package ${{ matrix.arch }}
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
          - arch: arm64
            rid: linux-arm64

    env:
      VERSION: ${{ needs.web.outputs.version }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: siren-web-dist
          path: web/dist

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Self-contained so the package does not depend on a dotnet install; ReadyToRun off because
      # the arm64 build runs on an amd64 runner and crossgen would need the cross-arch pack.
      - name: Publish the server (${{ matrix.rid }})
        run: >
          dotnet publish Jellyfin.Server/Jellyfin.Server.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishReadyToRun=false
          -p:DebugType=none
          -o out/server

      - name: Build the tarball
        run: >
          packaging/build-tarball.sh "$VERSION" ${{ matrix.arch }} out/server web/dist out/packages
          ${{ matrix.arch == 'amd64' && '--with-web' || '' }}

      - name: Build the deb
        run: packaging/build-deb.sh "$VERSION" ${{ matrix.arch }} out/server web/dist out/packages

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: siren-packages-${{ matrix.arch }}
          path: out/packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the GitHub Release
    needs: [web, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.web.outputs.version }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: siren-packages-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::No tag $tag in the repository. Start the run on an existing v* tag (gh workflow run release.yml --ref $tag -f publish=true) or push the tag." >&2
            exit 1
          fi
          gh release create "$tag" --generate-notes --title "Siren $VERSION" dist/*
